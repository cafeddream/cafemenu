<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF6B35">
  <title>Cafe D Dream Counter</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="admin-page">
  <header class="admin-header">
    <div>
      <h1 class="brand-title" id="adminRestaurant">Cafe D Dream</h1>
      <div class="subtle" id="clock">--:--</div>
    </div>
    <div class="summary-bar">
      <span id="activeTables">Active Tables: 0</span>
      <span id="todayCollection">Today's Collection: Rs 0</span>
      <nav class="staff-nav" aria-label="Staff pages">
        <a class="ghost-btn menu-btn" href="./kitchen.html">Kitchen</a>
        <a class="ghost-btn menu-btn" href="./index.html?table=T1">Test QR</a>
      </nav>
      <button class="ghost-btn menu-btn" id="menuButton" type="button">Menu</button>
      <button class="ghost-btn menu-btn" id="signOutBtn" type="button">Sign Out</button>
    </div>
  </header>

  <p class="menu-cache-banner subtle" id="menuCacheBanner" hidden></p>

  <main class="table-grid" id="tableGrid" aria-live="polite"></main>

  <div class="modal-backdrop" id="adminMenuModal" hidden>
    <section class="history-modal" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
      <div class="modal-head">
        <h2 id="menuTitle">Admin Menu</h2>
        <button class="ghost-btn" id="closeMenu" type="button">Close</button>
      </div>
      <div class="admin-menu-body">
        <div class="admin-menu-tabs">
          <button class="primary-btn" id="salesTab" type="button">Sales</button>
          <button class="ghost-btn" id="reportTab" type="button">Report</button>
        </div>
        <section class="sales-panel" id="salesPanel">
          <label class="select-label" for="salesTableSelect">Select Table</label>
          <select class="table-select" id="salesTableSelect"></select>
          <h3 id="historyTitle">Table History</h3>
          <div class="history-list" id="historyList"></div>
        </section>
        <section class="sales-panel" id="reportPanel" hidden>
          <h3>Sales Report</h3>
          <div class="report-filters">
            <label class="select-label" for="reportStartDate">From</label>
            <input class="table-select" id="reportStartDate" type="date">
            <label class="select-label" for="reportEndDate">To</label>
            <input class="table-select" id="reportEndDate" type="date">
          </div>
          <div class="report-actions">
            <button class="secondary-btn" id="refreshReportBtn" type="button">Load Report</button>
            <button class="ghost-btn" id="exportReportBtn" type="button">Export CSV</button>
          </div>
          <div id="reportContent"></div>
        </section>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="adminOrderModal" hidden>
    <section class="history-modal admin-order-modal" role="dialog" aria-modal="true" aria-labelledby="adminOrderTitle">
      <div class="modal-head">
        <h2 id="adminOrderTitle">Take Order</h2>
        <button class="ghost-btn" id="closeAdminOrder" type="button">Close</button>
      </div>
      <div class="admin-order-body">
        <section class="admin-order-screen active" id="adminOrderMenuScreen">
          <nav class="category-row admin-category-row" id="adminCategoryRow" aria-label="Menu categories"></nav>
          <div class="menu-list admin-order-menu-list" id="adminMenuList"></div>
        </section>
        <section class="admin-order-screen" id="adminOrderCartScreen" hidden>
          <div class="cart-header">
            <h3>Order Cart</h3>
            <button class="ghost-btn" id="adminBackToMenu" type="button">Back</button>
          </div>
          <div class="cart-list" id="adminCartList"></div>
          <div class="cart-total">
            <span>Grand Total</span>
            <span id="adminGrandTotal">₹0</span>
          </div>
        </section>
      </div>
      <div class="admin-order-footer">
        <div class="admin-order-summary" id="adminOrderSummary">
          <strong id="adminOrderCount">0 items</strong>
          <span id="adminOrderTotal">₹0</span>
        </div>
        <div class="admin-order-actions">
          <button class="ghost-btn" id="adminViewCartBtn" type="button" hidden>View Cart</button>
          <button class="primary-btn" id="adminPlaceOrderBtn" type="button" disabled>Place Order</button>
        </div>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="paymentMethodModal" hidden>
    <section class="history-modal payment-method-modal" role="dialog" aria-modal="true" aria-labelledby="paymentMethodTitle">
      <div class="modal-head">
        <h2 id="paymentMethodTitle">Mark Paid</h2>
        <button class="ghost-btn" id="closePaymentMethod" type="button">Close</button>
      </div>
      <div class="payment-method-body">
        <p id="paymentMethodTable">Select payment method.</p>
        <button class="primary-btn" id="paidCashBtn" type="button">Cash</button>
        <button class="secondary-btn" id="paidOnlineBtn" type="button">Online</button>
      </div>
    </section>
  </div>

  <script type="module" src="./admin.js"></script>
</body>
</html>
