<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF6B35">
  <title>Cafe D Dream Counter</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="admin-page">
  <header class="admin-header">
    <div>
      <h1 class="brand-title" id="adminRestaurant">Cafe D Dream</h1>
      <div class="subtle" id="clock">--:--</div>
    </div>
    <div class="summary-bar">
      <span id="activeTables">Active Tables: 0</span>
      <span id="todayCollection">Today's Collection: Rs 0</span>
      <button class="ghost-btn menu-btn" id="menuButton" type="button">Menu</button>
    </div>
  </header>

  <main class="table-grid" id="tableGrid" aria-live="polite"></main>

  <div class="modal-backdrop" id="adminMenuModal" hidden>
    <section class="history-modal" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
      <div class="modal-head">
        <h2 id="menuTitle">Admin Menu</h2>
        <button class="ghost-btn" id="closeMenu" type="button">Close</button>
      </div>
      <div class="admin-menu-body">
        <div class="admin-menu-tabs">
          <button class="primary-btn" id="salesTab" type="button">Sales</button>
          <button class="ghost-btn" id="reportTab" type="button">Report</button>
        </div>
        <section class="sales-panel" id="salesPanel">
          <label class="select-label" for="salesTableSelect">Select Table</label>
          <select class="table-select" id="salesTableSelect"></select>
          <h3 id="historyTitle">Table History</h3>
          <div class="history-list" id="historyList"></div>
        </section>
        <section class="sales-panel" id="reportPanel" hidden>
          <h3>Today's Report</h3>
          <button class="secondary-btn" id="refreshReportBtn" type="button">Refresh Report</button>
          <div id="reportContent"></div>
        </section>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="paymentMethodModal" hidden>
    <section class="history-modal payment-method-modal" role="dialog" aria-modal="true" aria-labelledby="paymentMethodTitle">
      <div class="modal-head">
        <h2 id="paymentMethodTitle">Mark Paid</h2>
        <button class="ghost-btn" id="closePaymentMethod" type="button">Close</button>
      </div>
      <div class="payment-method-body">
        <p id="paymentMethodTable">Select payment method.</p>
        <button class="primary-btn" id="paidCashBtn" type="button">Cash</button>
        <button class="secondary-btn" id="paidOnlineBtn" type="button">Online</button>
      </div>
    </section>
  </div>

  <script type="module" src="./admin.js"></script>
</body>
</html>
