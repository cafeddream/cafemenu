<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf7">
  <title>Cafe D Dream Kitchen</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="kitchen-page">
  <header class="kitchen-header">
    <div>
      <h1 class="brand-title">Kitchen Display</h1>
      <div class="subtle" id="kitchenClock">--:--</div>
    </div>
    <div class="kitchen-header-actions">
      <strong id="pendingCount">0 Orders Pending</strong>
      <a class="ghost-btn" href="./admin.html">Counter</a>
    </div>
  </header>

  <main id="kitchenMain" aria-live="polite"></main>

  <div class="modal-backdrop kitchen-items-backdrop" id="kitchenItemsModal" hidden>
    <section class="history-modal kitchen-items-modal" role="dialog" aria-modal="true" aria-labelledby="kitchenItemsModalTitle">
      <div class="modal-head">
        <div>
          <h2 id="kitchenItemsModalTitle">Order Items</h2>
          <div class="subtle" id="kitchenItemsModalMeta"></div>
        </div>
        <button class="ghost-btn" id="closeKitchenItems" type="button">Close</button>
      </div>
      <ul class="kitchen-detail-list" id="kitchenItemsModalList"></ul>
      <div class="kitchen-served-actions" id="kitchenServedActions" hidden>
        <button class="primary-btn served-confirm-btn" id="kitchenServedConfirm" type="button">Confirm</button>
      </div>
    </section>
  </div>

  <script type="module" src="./kitchen.js"></script>
</body>
</html>
