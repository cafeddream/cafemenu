<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF6B35">
  <title>Cafe D Dream Menu</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1 class="brand-title" id="restaurantName">Cafe D Dream</h1>
        <div class="subtle" id="tableLabel">Loading table...</div>
      </div>
      <button class="ghost-btn" id="addMoreTop" type="button" hidden>Menu</button>
    </header>

    <section class="screen active" id="menuScreen" aria-live="polite">
      <div class="menu-split">
        <nav class="category-sidebar" id="categoryRow" aria-label="Menu categories"></nav>
        <div class="menu-panel">
          <div class="menu-grid" id="menuList"></div>
        </div>
      </div>
    </section>

    <section class="screen" id="cartScreen">
      <div class="content">
        <div class="cart-header">
          <h2>Your Cart</h2>
          <button class="ghost-btn" id="backToMenu" type="button">Back</button>
        </div>
        <div class="cart-list" id="cartList"></div>
        <div class="cart-total">
          <span>Grand Total</span>
          <span id="grandTotal">₹0</span>
        </div>
        <button class="primary-btn" id="placeOrderBtn" type="button">Place Order</button>
      </div>
    </section>

    <section class="screen" id="paymentScreen">
      <div class="content">
        <div class="payment-panel">
          <h2>Payment</h2>
          <p class="order-status-live" id="orderStatusLive" aria-live="polite">Order status: New Order</p>
          <div id="paymentSummary"></div>
          <div class="payment-choice-grid">
            <button class="primary-btn" id="chooseOnlineBtn" type="button">Pay Online</button>
            <button class="secondary-btn" id="chooseCashBtn" type="button">Pay Cash at Counter</button>
          </div>
          <div class="online-payment-panel" id="onlinePaymentPanel" hidden>
            <img class="qr-img" id="upiQr" alt="UPI QR code">
            <div class="payment-buttons">
              <a class="primary-btn pay-link" id="payUpiBtn" href="#">Pay with UPI App</a>
              <a class="secondary-btn pay-link" id="payGpayBtn" href="#">Google Pay</a>
              <a class="secondary-btn pay-link" id="payPaytmBtn" href="#">Paytm</a>
            </div>
            <button class="ghost-btn paid-claim-btn" id="paymentDoneBtn" type="button">I have paid online</button>
          </div>
          <p class="payment-note" id="paymentNote">Choose how you want to pay for this order.</p>
          <p class="upi-text" id="upiIdText"></p>
          <button class="primary-btn" id="addMoreItems" type="button">Add More Items</button>
        </div>
      </div>
    </section>

    <section class="screen" id="errorScreen">
      <div class="content">
        <div class="error-panel">
          <h2 id="errorTitle">Something went wrong</h2>
          <p id="errorMessage"></p>
          <button class="primary-btn" id="retryMenu" type="button" hidden>Retry</button>
        </div>
      </div>
    </section>
  </main>

  <div class="bottom-bar" id="bottomBar">
    <div>
      <strong id="bottomCount">0 items</strong>
      <div id="bottomTotal">₹0</div>
    </div>
    <button class="primary-btn" id="viewCartBtn" type="button">View Cart</button>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
